# 공용 원격 실행(tools/remote-run) — 손으로 부를 때만 돎: gh workflow run remote.yml -f job=<id> -f datasets=<slug,…>
# Kaggle 커널과 같은 꼴: /kaggle/input/<데이터 이름>/ 읽고 /kaggle/working/ 에 씀. 실행 파일은 Kaggle 비공개 데이터 robbin0707/remote-jobs 의 run_<id>.py
# 이 저장소엔 작업 내용·데이터가 없음(공개 저장소여도 안전)
name: remote
run-name: ${{ inputs.job }}
on:
  workflow_dispatch:
    inputs:
      job:
        description: "작업 id (remote-jobs 안 run_<id>.py)"
        required: true
      datasets:
        description: "Kaggle 데이터 slug 쉼표 목록 → /kaggle/input/<이름>/"
        required: false
        default: ""
      runner:
        description: "러너 라벨"
        required: false
        default: "ubuntu-24.04"
      store:
        description: "1이면 실행 파일·데이터를 Kaggle 대신 이 저장소 릴리스 rr-store에서 받음(KAGGLE-OFF 10/28), 2면 받은 뒤 비밀값 RR_KEY로 암호를 풂(공개 저장소)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  run:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 355
    steps:
      - name: 준비
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RR_KEY: ${{ secrets.RR_KEY }}
          JOB: ${{ inputs.job }}
          DATASETS: ${{ inputs.datasets }}
          STORE: ${{ inputs.store }}
        run: |
          [[ "$JOB" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "작업 id 이상"; exit 1; }
          [[ "$DATASETS" =~ ^[A-Za-z0-9_,/.:-]*$ ]] || { echo "데이터 목록 이상"; exit 1; }
          sudo mkdir -p /kaggle/input /kaggle/working /kaggle/jobs
          sudo chown -R "$USER" /kaggle
          if [ "$STORE" = "1" ] || [ "$STORE" = "2" ]; then
            # KAGGLE-OFF(10/28 Kaggle 계정 정지): PC(remote.mjs)가 띄우기 직전 이 저장소 릴리스 rr-store에 올린 run_<id>.py·<이름>.bin을 받음
            gh release download rr-store -R "$GITHUB_REPOSITORY" -p "run_$JOB.py" -D /kaggle/jobs
            files="/kaggle/jobs/run_$JOB.py"
            for ds in ${DATASETS//,/ }; do
              s="${ds#local:}"; mkdir -p "/kaggle/input/$s"
              gh release download rr-store -R "$GITHUB_REPOSITORY" -p "$s.bin" -O "/kaggle/input/$s/bundle.bin"
              files="$files /kaggle/input/$s/bundle.bin"
            done
            if [ "$STORE" = "2" ]; then
              # 공개 저장소(10/28): 릴리스엔 암호화된 것만 있음 → 비밀값 RR_KEY로 풂
              [ -n "$RR_KEY" ] || { echo "RR_KEY 비밀값 없음"; exit 1; }
              for f in $files; do
                openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -md sha256 -pass env:RR_KEY -in "$f" -out "$f.dec" || { echo "암호 풀기 실패: $f"; exit 1; }
                mv "$f.dec" "$f"
              done
              echo "암호 풀기 끝($(echo $files | wc -w)개)"
            fi
          else
            pip install --quiet kaggle==2.2.4
            for ds in ${DATASETS//,/ }; do
              d="/kaggle/input/${ds#*/}"
              if ! kaggle datasets download "$ds" -p "$d" --unzip; then
                echo "통째 내려받기 실패 → 파일별로 받음(새로 만든 데이터는 통짜 압축본이 아직 없을 수 있음)"
                mkdir -p "$d"
                for f in $(kaggle datasets files "$ds" --page-size 200 | awk '$2 ~ /^[0-9]+$/ {print $1}'); do
                  kaggle datasets download "$ds" -f "$f" -p "$d" --unzip
                done
              fi
            done
            kaggle datasets download robbin0707/remote-jobs -f "run_$JOB.py" -p /kaggle/jobs --unzip
          fi
          cp "/kaggle/jobs/run_$JOB.py" /tmp/run.py
          rm -rf /kaggle/jobs
          # 2026-10-26: GitHub 러너엔 ffmpeg가 없음(숏큐멘터리 학습이 컷 1개·자막 0줄로 '성공') → 작업이 ffmpeg를 쓰면 설치
          if grep -q ffmpeg /tmp/run.py && ! command -v ffmpeg >/dev/null; then
            sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null && echo "ffmpeg 설치: $(ffmpeg -version | head -1)"
          fi
          ls -la /kaggle/input/*/ | head -40
          echo "RR_READY nproc=$(nproc) mem=$(free -g | awk '/Mem/{print $2}')G"
      - name: 실행
        run: python3 /tmp/run.py
      - name: 결과 올리기
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.job }}
          path: /kaggle/working
          retention-days: 2
          if-no-files-found: warn
